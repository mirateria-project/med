<style>
/* Layout: one column, today's three big check buttons first, then the month calendar, then the medicine list. */
:root{
  --bg:#eef3f8; --card:#ffffff; --ink:#14212e; --sub:#4a5b6c; --line:#c9d6e3;
  --taken:#1f6fe0; --taken-ink:#ffffff; --miss:#e23b3b; --miss-ink:#ffffff; --future:#b9c6d3;
  --all:#d6e8ff; --some:#fff0a8; --none:#ffd9d9;
  --ban-bg:#4a5059; --ban-edge:#2e333a; --accent:#1456b8;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --card:#18222c; --ink:#eef3f8; --sub:#a9b8c7; --line:#2d3b49;
  --taken:#4b8fff; --miss:#ff5a5a; --future:#3d4b59;
  --all:#1e3d66; --some:#5c4f12; --none:#5e2525; --accent:#6aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --card:#18222c; --ink:#eef3f8; --sub:#a9b8c7; --line:#2d3b49;
  --taken:#4b8fff; --miss:#ff5a5a; --future:#3d4b59;
  --all:#1e3d66; --some:#5c4f12; --none:#5e2525; --accent:#6aa2ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .08s,filter .08s,box-shadow .08s}
button:active,.press:active{transform:scale(.94) translateY(2px);filter:brightness(.85)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* banner */
#ban{position:relative;margin-right:10px}
#ban .mq{height:92px;overflow:hidden;border-radius:12px;background:var(--ban-bg);border:2px solid var(--ban-edge);position:relative;cursor:pointer}
#trk{position:absolute;top:0;left:0;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;white-space:nowrap;will-change:transform;color:#fff;font-weight:800;font-size:20px}
#trk img{height:62px;width:auto;display:block;max-width:none}
#trk small{font-size:12px;font-weight:600;color:#e6eaef}
#bx{position:absolute;top:-12px;right:-10px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:#2e333a;color:#fff;font-size:17px;line-height:1;padding:0;box-shadow:0 2px 5px #0006}
#np{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:12px;background:var(--ban-bg);color:#fff;font-weight:800;font-size:18px;border:3px solid #ffd60a;animation:glow 1s ease-in-out infinite alternate;padding:8px 12px;text-align:center}
@keyframes glow{from{box-shadow:0 0 0 0 transparent;border-color:#ffd60a}50%{border-color:#ff4fd8}to{box-shadow:0 0 18px 4px #ffd60a;border-color:#3cf0ff}}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:24px;margin:0;font-weight:900;letter-spacing:.02em}
.ghost{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:20px;margin:0 0 10px;font-weight:900}
.today-date{font-size:16px;color:var(--sub);font-weight:700;margin:-4px 0 12px}

/* today: three big buttons */
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.slot .lb{font-size:30px;font-weight:900;line-height:1}
.bigbtn{width:100%;aspect-ratio:1;max-width:120px;border-radius:50%;border:4px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;line-height:1.15;box-shadow:0 5px 0 #0003}
.bigbtn .mk{font-size:34px;line-height:1}
.bigbtn.miss{background:var(--miss);color:var(--miss-ink)}
.bigbtn.taken{background:var(--taken);color:var(--taken-ink)}
.bigbtn:active{box-shadow:0 1px 0 #0003}
.undo{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 8px;font-size:15px;font-weight:800;white-space:nowrap;max-width:100%}
.big3.n1{grid-template-columns:minmax(0,160px);justify-content:center}.big3.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.chk{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:800;white-space:nowrap}.chk input{width:24px;height:24px;accent-color:var(--accent)}
.medrow.offrow input[type=text]{opacity:.4}
.slot .meds{font-size:15px;color:var(--sub);text-align:center;font-weight:700;word-break:break-word;min-height:1.5em}

/* calendar */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:22px}
.nav button{width:52px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:20px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow div{text-align:center;font-size:13px;color:var(--sub);font-weight:700}
.dow .su{color:var(--miss)}.dow .sa{color:var(--taken)}
.cell{min-width:0;border:1px solid var(--line);border-radius:9px;padding:3px 1px 4px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell.blank{border:none}
.cell.all{background:var(--all)}.cell.some{background:var(--some)}.cell.none{background:var(--none)}
.cell.today{outline:3px solid #ffc400;outline-offset:-1px;animation:tblink 1.6s ease-in-out infinite}
@keyframes tblink{0%,100%{outline-color:#ffc400;box-shadow:0 0 10px 2px #ffc400aa}50%{outline-color:#ffc40033;box-shadow:0 0 0 0 transparent}}
.cell .d{font-size:14px;font-weight:800;line-height:1.1}
.trio{display:flex;justify-content:center;gap:1px;width:100%}
.mini{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:0}
.mini i{font-style:normal;font-size:11px;font-weight:900;line-height:1.1}
.mini b{display:block;width:13px;height:13px;border-radius:50%;background:var(--future)}
.mini b.t{background:var(--taken)}.mini b.m{background:var(--miss)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--sub);margin-top:10px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:14px;height:14px;border-radius:50%;display:inline-block}
.pri{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:18px;font-weight:900;background:var(--accent);color:#fff;margin-top:12px;box-shadow:0 4px 0 #0003}

/* medicines */
.medrow{display:grid;grid-template-columns:auto 52px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.medrow label{font-size:22px;font-weight:900;text-align:center}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:80px;resize:vertical}
.note{font-size:14px;color:var(--sub);line-height:1.6}
.off{font-size:15px;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}

/* dialogs */
.ov{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:100%;overflow:auto}
.dlg h3{margin:0 0 12px;font-size:22px;padding-right:48px}
.dlg{position:relative}.xtop{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:48px;height:48px;border-radius:50%;border:none;background:var(--miss);color:#fff;font-size:26px;font-weight:900;line-height:1;z-index:2;box-shadow:0 3px 0 #0003}
.dlg img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.row2 button,.close{border:none;border-radius:12px;padding:14px;font-size:18px;font-weight:900}
.yes{background:var(--accent);color:#fff}.no,.close{background:var(--line);color:var(--ink)}
.close{width:100%;margin-top:14px}
#privacy .dlg{background:#14181e;border:2px solid #0056ca}
#privacy .dlg p{color:#0056ca;font-size:22px;font-weight:900;line-height:1.7;margin:0;letter-spacing:.02em;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,1.5px 1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px -1.5px 0 #fff}
#privacy .note{color:#e6eaef}
.ph{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--sub);font-size:14px;margin-top:10px}
/* registered medicines (always shown above today's buttons, can fold) */
.mlh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mlh h2{margin:0}
.fold{border:2px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:900;white-space:nowrap}
#mlist{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.mi .nm{flex:1;min-width:0;font-size:20px;font-weight:900;word-break:break-word}
.tm{display:flex;gap:4px;flex-wrap:wrap}
.tm span{background:var(--accent);color:#fff;border-radius:8px;padding:2px 8px;font-size:15px;font-weight:900}
.del{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:15px;font-weight:800}
.mmemo{font-size:16px;color:var(--sub);font-weight:700;white-space:pre-wrap;word-break:break-word}
.empty{font-size:16px;color:var(--sub);font-weight:700}
.reg{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:20px;font-weight:900;background:var(--accent);color:#fff;margin-top:10px;box-shadow:0 4px 0 #0003}
.reg:disabled{opacity:.45}
.tchk{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.tchk label{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:900;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.tchk input{width:26px;height:26px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#1a7f37;color:#fff;font-size:20px;font-weight:900;padding:14px 22px;border-radius:14px;box-shadow:0 6px 18px #0005;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#np{animation:none}}
</style>

 nName:'Medicine name',reg:'Add',regOk:'✓ Added',needT:'Choose at least one time',mlH:'My medicines',open:'Details ▼',shut:'Close ▲',empty:'Nothing added yet. Use "Add a medicine" below.',del:'Delete',delQ:n=>'Delete "'+n+'"?',delOk:'Deleted',memoH:'Notes',
 saveNote:'Notes save as you type. Added medicines always show in "My medicines" at the top.',
 off:'📶 Works without a connection. Everything is stored on this device.',
 dayT:d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),close:'Close',
 sendQ:"This month's calendar will be made into a picture. You choose who to send it to next. OK?",yes:'Yes',no:'Cancel',
 shotT:'Calendar picture',shotHelp:'Press and hold the picture to save it or send it with LINE.',
 again:'Why did you close me…',privacy:'This app does not collect or send personal information. It only receives banner ads.',pTap:'(Tap to close)',
 hT:'How to add to your Home Screen',hi:'<b>iPhone</b><br>Safari Share button (□ with ↑) → "Add to Home Screen"<br><br><b>Android</b><br>Chrome menu "︙" → "Add to Home screen"',ph:'The "Home Screen" guide illustration goes here',
 img:'Medicine calendar',npTap:'Tap to see the picture',lang:'日本語'}};
let T=TT[L];
document.documentElement.lang=L;
const $=id=>document.getElementById(id);

/* storage: autosave on every change */
function load(k,d){try{const v=localStorage.getItem('med_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem('med_'+k,JSON.stringify(v))}catch(e){}}
let data=load('checks',{}),meds=load('meds',{m0:'',m1:'',m2:'',memo:''});if(!Array.isArray(meds.use))meds.use=[true,true,true];
const act=()=>{if(Array.isArray(meds.list)&&meds.list.length){const a=[0,1,2].filter(i=>meds.list.some(m=>m.t[i]));if(a.length)return a}return [0,1,2].filter(i=>meds.use[i]).length?[0,1,2].filter(i=>meds.use[i]):[0,1,2]};
/* carry over records from the previous version of this app */
try{if(!localStorage.getItem('med_checks')){const o=JSON.parse(localStorage.getItem('checks')||'null');if(o&&typeof o=='object')data=o}
 if(!localStorage.getItem('med_meds')){const o=JSON.parse(localStorage.getItem('meds')||'null');if(typeof o=='string'&&o)meds.memo=o}}catch(e){}
/* merge records from the former お薬チェック app (key medcheck-v1), once */
try{if(!load('mergedV1',false)){const o=JSON.parse(localStorage.getItem('medcheck-v1')||'null');
 if(o&&typeof o=='object'){const fresh=!localStorage.getItem('med_meds');
  Object.keys(o.checks||{}).forEach(k=>{const p=k.split('-').map(Number);if(p.length!=3)return;const nk=p[0]+'-'+p[1]+'-'+p[2],a=data[nk]||[false,false,false],b=o.checks[k]||[];data[nk]=[0,1,2].map(i=>!!(a[i]||b[i]))});
  (o.names||[]).forEach((n,i)=>{if(n&&!meds['m'+i])meds['m'+i]=n});
  if(fresh&&Array.isArray(o.use)&&o.use.some(Boolean))meds.use=[0,1,2].map(i=>!!o.use[i]);}
 store('checks',data);store('meds',meds);store('mergedV1',true)}}catch(e){}
/* turn the old one-box-per-time names into list entries, once */
if(!Array.isArray(meds.list)){meds.list=[];[0,1,2].forEach(i=>{const n=(meds['m'+i]||'').trim();if(!n)return;const f=meds.list.find(m=>m.n==n);if(f)f.t[i]=true;else{const t=[false,false,false];t[i]=true;meds.list.push({n,t})}});store('meds',meds)}
function saveAll(){store('checks',data);store('meds',meds)}
addEventListener('pagehide',saveAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveAll()});

const key=(y,m,d)=>y+'-'+(m+1)+'-'+d;
const st=k=>data[k]||[false,false,false];
function toggle(k,i){const c=st(k).slice();c[i]=!c[i];data[k]=c;store('checks',data);drawAll()}
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};

/* press sound */
let AC=null;
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=1200;g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.08);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.09)}catch(e){}try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.press,.mq,.cell[data-k],input[type=checkbox]'))beep()},true);

/* today */
function drawToday(){
 const t=new Date(),k=key(t.getFullYear(),t.getMonth(),t.getDate()),s=st(k);
 $('tDate').textContent=T.date(t);
 const A=act();$('big3').className='big3 n'+A.length;
 $('big3').innerHTML=A.map(i=>slotHTML(i,s,true)).join('');
 bindSlots($('big3'),k,drawToday);
}
function slotHTML(i,s,withMeds){const lb=T.slots[i];return `<div class="slot"><div class="lb">${lb}</div>
  <button class="bigbtn ${s[i]?'taken':'miss'}" data-i="${i}" aria-pressed="${s[i]}"><span class="mk">${s[i]?'✓':'●'}</span>${s[i]?T.taken:T.miss}</button>
  ${withMeds?`<div class="meds">${meds.list.filter(m=>m.t[i]).map(m=>esc(m.n)).join('<br>')}</div>`:''}</div>`}
function bindSlots(box,k,after){
 box.querySelectorAll('.bigbtn').forEach(b=>b.onclick=()=>{toggle(k,+b.dataset.i);after&&after()});
 box.querySelectorAll('.undo').forEach(b=>b.onclick=()=>{toggle(k,+b.dataset.u);after&&after()})}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* calendar */
let Y=new Date().getFullYear(),M=new Date().getMonth();
function drawCal(){
 $('mon').textContent=T.mon(Y,M+1);
 $('dow').innerHTML=T.dow.map((w,i)=>`<div class="${i==0?'su':i==6?'sa':''}">${w}</div>`).join('');
 const first=new Date(Y,M,1).getDay(),days=new Date(Y,M+1,0).getDate(),td=today0();let h='';
 for(let i=0;i<first;i++)h+='<div class="cell blank"></div>';
 for(let d=1;d<=days;d++){
  const k=key(Y,M,d),s=st(k),A=act(),n=A.filter(i=>s[i]).length,dt=new Date(Y,M,d),past=dt<=td;
  let c='cell';if(A.length&&n==A.length)c+=' all';else if(n>0)c+=' some';else if(dt<td)c+=' none';if(+dt==+td)c+=' today';
  h+=`<div class="${c} press" data-k="${k}" data-d="${d}" role="button" tabindex="0"><div class="d">${d}</div><div class="trio">${
   A.map(i=>{const lb=T.slots[i];return `<span class="mini"><i>${L=='ja'?lb:lb[0]}</i><b class="${s[i]?'t':past?'m':''}"></b></span>`}).join('')}</div></div>`}
 $('grid').innerHTML=h;
 $('legend').innerHTML=T.lg.map(([c,t])=>`<span><b style="background:var(--${c=='t'?'taken':c=='m'?'miss':'future'})"></b>${t}</span>`).join('');
}
$('grid').onclick=e=>{const c=e.target.closest('.cell[data-k]');if(c)openDay(c.dataset.k,+c.dataset.d)};
$('prev').onclick=()=>{M--;if(M<0){M=11;Y--}drawCal()};
$('next').onclick=()=>{M++;if(M>11){M=0;Y++}drawCal()};

/* dialogs */
function openDlg(html){$('dlg').innerHTML=`<button class="xtop" id="xtop" aria-label="${T.close}">×</button>`+html;$('xtop').onclick=closeDlg;$('ovl').hidden=false}
function closeDlg(){$('ovl').hidden=true;$('dlg').innerHTML=''}
$('ovl').addEventListener('click',e=>{if(e.target.id=='ovl')closeDlg()});
let dayK=null,dayD=null;
function openDay(k,d){dayK=k;dayD=new Date(Y,M,d);renderDay()}
function renderDay(){const s=st(dayK),A=act();
 openDlg(`<h3>${T.dayT(dayD)}</h3><div class="big3 n${A.length}">${A.map(i=>slotHTML(i,s,false)).join('')}</div><button class="close" id="dc">${T.close}</button>`);
 bindSlots($('dlg'),dayK,renderDay);
 $('dc').onclick=closeDlg}

/* home screen help */
$('hbtn').onclick=()=>{openDlg(`<h3>${T.hT}</h3><div style="font-size:17px;line-height:1.7">${T.hi}</div><div class="ph">${T.ph}</div><button class="close" id="dc">${T.close}</button>`);$('dc').onclick=closeDlg};

/* medicines */
$('memo').value=meds.memo||'';$('memo').oninput=()=>{meds.memo=$('memo').value;store('meds',meds);drawList()};
let open=load('listOpen',true);
function drawList(){
 const l=meds.list;$('mlH').textContent=T.mlH+(l.length?'（'+l.length+'）':'');
 $('fold').textContent=open?T.shut:T.open;$('mbody').hidden=!open;
 $('mlist').innerHTML=l.length?l.map((m,j)=>`<div class="mi"><div class="nm">${esc(m.n)}</div><div class="tm">${[0,1,2].filter(i=>m.t[i]).map(i=>`<span>${T.slots[i]}</span>`).join('')}</div><button class="del" data-j="${j}">${T.del}</button></div>`).join(''):`<div class="empty">${T.empty}</div>`;
 $('mmemoV').textContent=(meds.memo||'').trim()?'📝 '+meds.memo.trim():'';
 $('mlist').querySelectorAll('.del').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,n=l[j]&&l[j].n;
  openDlg(`<h3>${esc(T.delQ(n))}</h3><div class="row2"><button class="no" id="dn">${T.no}</button><button class="yes" id="dy">${T.del}</button></div>`);
  $('dn').onclick=closeDlg;$('dy').onclick=()=>{l.splice(j,1);store('meds',meds);closeDlg();drawAll();toast(T.delOk)}})}
$('fold').onclick=()=>{open=!open;store('listOpen',open);drawList()};
let tT=null;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2200)}
function regState(){$('regBtn').disabled=!$('nName').value.trim()}
$('nName').oninput=regState;
$('nName').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();$('regBtn').click()}};
$('regBtn').onclick=()=>{const n=$('nName').value.trim();if(!n)return;const t=[0,1,2].map(i=>$('t'+i).checked);
 if(!t.some(Boolean)){toast(T.needT);return}
 const f=meds.list.find(m=>m.n==n);if(f)f.t=t;else meds.list.push({n,t});store('meds',meds);
 $('nName').value='';regState();$('nName').blur();open=true;store('listOpen',open);drawAll();toast(T.regOk);
 $('mcard').scrollIntoView({behavior:'smooth',block:'start'})};

/* banner (shared across apps): logo flows left → right every launch, × reappears once after 1s */
const BC={speed:60,get again(){return T.again}};
const LOGO_HTML=`<img alt="MIRATERIA" src="${LOGO}"><small>${ADDR}</small>`;
let BA=null,againUsed=false;
function runBanner(){const mq=$('mq'),t=$('trk');if(BA){BA.cancel();BA=null}if($('ban').hidden)return;
 const cw=mq.clientWidth,tw=t.offsetWidth;if(!cw||!tw)return;
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){t.style.transform='translateX('+Math.max(0,(cw-tw)/2)+'px)';return}
 BA=t.animate([{transform:'translateX('+(-tw)+'px)'},{transform:'translateX('+cw+'px)'}],{duration:(cw+tw)/BC.speed*1000,iterations:Infinity})}
function showBanner(txt){$('ban').hidden=false;const t=$('trk');if(txt){t.textContent=txt}else{t.innerHTML=LOGO_HTML;const im=t.querySelector('img');if(!im.complete)im.onload=runBanner}runBanner()}
$('bx').onclick=()=>{$('ban').hidden=true;if(BA)BA.cancel();if(!againUsed&&BC.again){againUsed=true;setTimeout(()=>showBanner(BC.again),1000)}};
$('mq').onclick=()=>openDlg(`<img alt="MIRATERIA" src="${LOGO}"><div style="text-align:center;font-size:15px;margin-top:8px;color:var(--sub)">${ADDR}</div><button class="close" id="dc">${T.close}</button>`)||($('dc').onclick=closeDlg);
addEventListener('resize',runBanner);

/* new-product slot: glows in place, tap shows the picture (called by the banner manager later) */
window.showNewProduct=function(o){const n=$('np');n.textContent=(o&&o.text||'')+' ✨ '+T.npTap;n.hidden=false;
 n.onclick=()=>{openDlg(`${o&&o.img?`<img src="${esc(o.img)}" alt="">`:''}<div style="font-size:18px;font-weight:800;margin-top:8px">${esc(o&&o.text)}</div><button class="close" id="dc">${T.close}</button>`);$('dc').onclick=closeDlg}};

/* first launch privacy notice */
if(!load('privSeen',false)){$('pTxt').textContent=T.privacy;$('pTap').textContent=T.pTap;$('privacy').hidden=false}
$('privacy').onclick=()=>{$('privacy').hidden=true;store('privSeen',true)};

function drawAll(){drawList();drawToday();drawCal()}
function labels(){document.title=T.ttl;document.documentElement.lang=L;$('lbtn').textContent=T.lang;$('ttl').textContent=T.ttl;$('hbtn').textContent=T.home;$('tH').textContent=T.today;$('useHint').textContent=T.useHint;$('nName').placeholder=T.nName;$('regBtn').textContent=T.reg;$('memoH').textContent=T.memoH;regState();$('mH').textContent=T.medsH;
 $('memo').placeholder=T.memo;$('saveNote').textContent=T.saveNote;$('offNote').textContent=T.off;$('tapHint').textContent=T.tapHint;
 T.slots.forEach((s,i)=>$('l'+i).textContent=s);$('bx').setAttribute('aria-label',T.close)}
$('lbtn').onclick=()=>{L=L=='ja'?'en':'ja';T=TT[L];try{localStorage.setItem('app-lang',L)}catch(e){}labels();drawAll();if(!$('privacy').hidden){$('pTxt').textContent=T.privacy;$('pTap').textContent=T.pTap}};
labels();drawAll();showBanner();
/* refresh "today" when the app comes back the next day */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)drawAll()});
</script>
</body>
</html>

</body></html>
