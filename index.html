<title>服薬チェック</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
/* Layout: one column. Banner, header, medicine list (folds), today's buttons with alarms, calendar, add-medicine form. */
:root{
  --bg:#eef3f8; --card:#ffffff; --ink:#14212e; --sub:#4a5b6c; --line:#c9d6e3;
  --taken:#1f6fe0; --taken-ink:#ffffff; --miss:#e23b3b; --miss-ink:#ffffff; --future:#b9c6d3;
  --all:#d6e8ff; --some:#fff0a8; --none:#ffd9d9;
  --warn-bg:#fff4d6; --warn-line:#e0a100; --warn-ink:#5a3e00;
  --soft-bg:#e9f1ff; --soft-line:#8fb2ec;
  --accent:#1456b8; --ok:#1a7f37;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --card:#18222c; --ink:#eef3f8; --sub:#a9b8c7; --line:#2d3b49;
  --taken:#4b8fff; --miss:#ff5a5a; --future:#3d4b59;
  --all:#1e3d66; --some:#5c4f12; --none:#5e2525;
  --warn-bg:#3b2f0c; --warn-line:#d39a00; --warn-ink:#ffe7a6;
  --soft-bg:#172a45; --soft-line:#3d64a6;
  --accent:#6aa2ff; --ok:#2ea44f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --card:#18222c; --ink:#eef3f8; --sub:#a9b8c7; --line:#2d3b49;
  --taken:#4b8fff; --miss:#ff5a5a; --future:#3d4b59;
  --all:#1e3d66; --some:#5c4f12; --none:#5e2525;
  --warn-bg:#3b2f0c; --warn-line:#d39a00; --warn-ink:#ffe7a6;
  --soft-bg:#172a45; --soft-line:#3d64a6;
  --accent:#6aa2ff; --ok:#2ea44f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:4px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,.btn{font:inherit;color:inherit;cursor:pointer;transition:transform .08s,filter .08s,box-shadow .08s}
button:active,.press:active,.btn:active{transform:scale(.94) translateY(2px);filter:brightness(.85)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#np{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:12px;background:#4a5059;color:#fff;font-weight:800;font-size:18px;border:3px solid #ffd60a;animation:glow 1s ease-in-out infinite alternate;padding:8px 12px;text-align:center}
@keyframes glow{from{box-shadow:0 0 0 0 transparent;border-color:#ffd60a}50%{border-color:#ff4fd8}to{box-shadow:0 0 18px 4px #ffd60a;border-color:#3cf0ff}}

header{display:flex;flex-direction:column;gap:10px}
h1{font-size:26px;margin:0;font-weight:900;letter-spacing:.02em}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:16px;font-weight:800;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:21px;margin:0 0 10px;font-weight:900}
.today-date{font-size:17px;color:var(--sub);font-weight:800;margin:-4px 0 10px}
#tH{padding-right:96px}

/* alarm master */
.almast{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:12px}
.almast b{font-size:18px;font-weight:900}
.sw{border:none;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:900;min-width:132px;box-shadow:0 3px 0 #0003}
.sw.on{background:var(--ok);color:#fff}.sw.offs{background:var(--line);color:var(--ink)}
.alnote{font-size:14px;color:var(--sub);font-weight:700;margin-top:10px;line-height:1.5}

/* supply warnings + soft notice */
.warns{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.warn{display:block;width:100%;text-align:left;background:var(--warn-bg);border:3px solid var(--warn-line);color:var(--warn-ink);border-radius:14px;padding:10px 12px;font-size:18px;font-weight:900;line-height:1.45}
.soft{background:var(--soft-bg);border:2px solid var(--soft-line);border-radius:14px;padding:12px;font-size:16px;font-weight:700;line-height:1.6;margin-top:10px}

/* today: big buttons */
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big3.n1{grid-template-columns:minmax(0,170px);justify-content:center}.big3.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.slot .lb{font-size:30px;font-weight:900;line-height:1}
.alchip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:4px 8px;font-size:15px;font-weight:900;line-height:1.25;max-width:100%;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.alchip.on{border-color:var(--ok);color:var(--ok)}
.alchip.dim{opacity:.55}
.bigbtn{width:100%;aspect-ratio:1;max-width:120px;border-radius:50%;border:4px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;line-height:1.15;box-shadow:0 5px 0 #0003}
.bigbtn .mk{font-size:34px;line-height:1}
.bigbtn.miss{background:var(--miss);color:var(--miss-ink)}
.bigbtn.taken{background:var(--taken);color:var(--taken-ink)}
.bigbtn:active{box-shadow:0 1px 0 #0003}
.slot .meds{font-size:15px;color:var(--sub);text-align:center;font-weight:800;word-break:break-word;line-height:1.35;min-height:1.4em;width:100%}

/* calendar */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{width:52px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:20px}
.nav button.ym{flex:1;min-width:0;width:auto;margin:0 8px;padding:6px 8px;font-size:21px;font-weight:900;white-space:nowrap}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.yrow b{font-size:28px;font-weight:900}
.yrow button{width:60px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mgrid button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 0;font-size:19px;font-weight:900}
.mgrid button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.thism{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:18px;font-weight:900;background:#ffc400;color:#14212e;margin-top:14px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow div{text-align:center;font-size:13px;color:var(--sub);font-weight:700}
.dow .su{color:var(--miss)}.dow .sa{color:var(--taken)}
.cell{position:relative;min-width:0;border:1px solid var(--line);border-radius:9px;padding:3px 1px 4px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell.blank{border:none}
.cell.all{background:var(--all)}.cell.some{background:var(--some)}.cell.none{background:var(--none)}
.cell.today{border-color:#ffc400}
.cell.today::after{content:"";position:absolute;inset:-3px;border:4px solid #ffc400;border-radius:11px;box-shadow:0 0 10px 3px #ffc400;pointer-events:none;-webkit-animation:tblink 1.2s ease-in-out infinite;animation:tblink 1.2s ease-in-out infinite}
@-webkit-keyframes tblink{0%,100%{opacity:1}50%{opacity:.1}}
@keyframes tblink{0%,100%{opacity:1}50%{opacity:.1}}
.cell .d{font-size:14px;font-weight:800;line-height:1.1}
.trio{display:flex;justify-content:center;gap:1px;width:100%}
.mini{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:0}
.mini i{font-style:normal;font-size:11px;font-weight:900;line-height:1.1}
.mini b{display:block;width:13px;height:13px;border-radius:50%;background:var(--future)}
.mini b.t{background:var(--taken)}.mini b.m{background:var(--miss)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--sub);margin-top:10px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:14px;height:14px;border-radius:50%;display:inline-block}

/* medicine list */
.mlh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mlh h2{margin:0}
.mlb{display:flex;gap:8px;flex-wrap:wrap}
.fold,.biglist{border:2px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:900;white-space:nowrap}
.biglist{background:var(--accent);color:#fff}
#mlist{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;text-align:left}
.mi .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mi .nm{font-size:20px;font-weight:900;word-break:break-word;line-height:1.3}
.mi .sub{font-size:14px;color:var(--sub);font-weight:800}
.tm{display:flex;gap:4px;flex-wrap:wrap}
.tm span{background:var(--accent);color:#fff;border-radius:8px;padding:2px 8px;font-size:15px;font-weight:900}
.tm span.k{background:transparent;color:var(--sub);border:2px solid var(--line);padding:0 6px}
.mi .ed{font-size:15px;font-weight:900;color:var(--accent);white-space:nowrap}
.mmemo{font-size:16px;color:var(--sub);font-weight:700;white-space:pre-wrap;word-break:break-word;margin-top:8px}
.empty{font-size:16px;color:var(--sub);font-weight:700}

/* form */
input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;font:inherit;font-size:19px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px;min-width:0}
input[type=time]{font-size:28px;font-weight:900;text-align:center}
textarea{min-height:80px;resize:vertical}
.fl{font-size:16px;font-weight:900;margin:14px 0 6px}
.note{font-size:14px;color:var(--sub);line-height:1.6}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:18px;font-weight:900}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tchk{display:flex;gap:10px;flex-wrap:wrap}
.tchk label{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:900;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.tchk input,.supchk input{width:26px;height:26px;accent-color:var(--accent)}
.supchk{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:900;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px}
.supbox{border-left:4px solid var(--line);padding-left:12px;margin-top:4px}
.dayrow{display:flex;gap:8px;align-items:center}
.dayrow input{max-width:130px}
.dayrow span{font-size:19px;font-weight:900}
.reg{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:20px;font-weight:900;background:var(--accent);color:#fff;margin-top:16px;box-shadow:0 4px 0 #0003}
.reg:disabled{opacity:.45}
.off{font-size:15px;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.ver{font-size:13px;color:var(--sub);text-align:center}

/* dialogs */
.ov{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{position:relative;background:var(--card);color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow:auto}
.dlg h3{margin:0 0 12px;font-size:23px;padding-right:52px;line-height:1.35}
.xtop{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:48px;height:48px;border-radius:50%;border:none;background:var(--miss);color:#fff;font-size:26px;font-weight:900;line-height:1;z-index:2;box-shadow:0 3px 0 #0003}
.dlg img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.dlg ul{padding-left:22px;line-height:1.7;margin:0 0 8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.row2 button,.close,.wide{border:none;border-radius:12px;padding:14px;font-size:18px;font-weight:900}
.yes{background:var(--accent);color:#fff}.no,.close{background:var(--line);color:var(--ink)}
.close,.wide{display:block;width:100%;margin-top:14px}
.danger{background:transparent;border:2px solid var(--miss)!important;color:var(--miss)}
.refill{background:var(--ok);color:#fff}
.free{background:var(--soft-bg);border:2px solid var(--soft-line);border-radius:12px;padding:12px;font-weight:800;line-height:1.6;margin-top:8px}
/* alarm ringing */
#ring .dlg{border:4px solid #ffc400;text-align:center}
#ring .bell{font-size:64px;line-height:1;animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
#ring .rt{font-size:28px;font-weight:900;margin:10px 0 4px}
#ring .rw{font-size:20px;font-weight:800;color:var(--sub)}
#ring .rm{font-size:20px;font-weight:900;margin-top:8px;word-break:break-word}
#ring .take{display:block;width:100%;border:none;border-radius:16px;padding:18px;font-size:24px;font-weight:900;background:var(--taken);color:#fff;margin-top:16px;box-shadow:0 4px 0 #0003}
/* printed list for clinic */
.bl{display:flex;flex-direction:column;gap:10px}
.bli{border:2px solid var(--line);border-radius:12px;padding:12px}
.bli .nm{font-size:24px;font-weight:900;word-break:break-word;line-height:1.3}
.bli .tm{margin-top:6px}
.bli .tm span{font-size:17px}
#privacy .dlg{background:#14181e;border:2px solid #0056ca}
#privacy .dlg p{color:#0056ca;font-size:22px;font-weight:900;line-height:1.7;margin:0;letter-spacing:.02em;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,1.5px 1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px -1.5px 0 #fff}
#privacy .note{color:#e6eaef}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ok);color:#fff;font-size:20px;font-weight:900;padding:14px 22px;border-radius:14px;box-shadow:0 6px 18px #0005;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){#np,#ring .bell{animation:none}.cell.today::after{animation:none}}

/* drink-together note (plain "good to know") */
.ixbox{background:var(--soft-bg);border:2px solid var(--soft-line);border-radius:14px;padding:12px;color:var(--ink);margin-top:10px}
.ixh{font-size:17px;font-weight:800;margin-bottom:4px}
.ixp{font-size:17px;font-weight:700;line-height:1.45;word-break:break-word;padding:3px 0}
.ixm{font-size:17px;font-weight:500;line-height:1.6;margin:6px 0 0}
.ixn{font-size:13px;color:var(--sub);margin-top:6px}

/* decorations: Shi-chan corner and hanging keychains (kept off buttons and the calendar) */
.sc{display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:end;gap:6px}
.scb{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:18px;font-weight:900;line-height:1.45;min-height:64px;display:flex;align-items:center;margin-bottom:14px;word-break:break-word}
.scb::after{content:"";position:absolute;right:-14px;bottom:14px;border:9px solid transparent;border-left:14px solid var(--ink)}
.scb::before{content:"";position:absolute;right:-8px;bottom:17px;border:6px solid transparent;border-left:9px solid var(--card);z-index:1}
.scb.pop{animation:scpop .25s ease-out}
@keyframes scpop{from{transform:scale(.9)}to{transform:scale(1)}}
.scimg{width:92px;height:auto;display:block;border:none;background:none;padding:0;cursor:pointer;transform-origin:50% 100%;animation:scbob 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.scimg img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 4px #0003)}
.scimg.hop{animation:schop .5s ease-in-out 0s 2}
.scimg.talk{animation:sctalk .16s ease-in-out 0s 6}
@keyframes scbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes schop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:scale(1.08,.9)}55%{transform:translateY(-22%) scale(.96,1.05)}85%{transform:scale(1.05,.94)}}
@keyframes sctalk{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.95)}}
.hang{position:relative}
.kch{position:absolute;top:-12px;right:12px;width:80px;height:106px;border:none;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:2}
.kj{position:absolute;inset:0;will-change:transform}
.kch>.kj1,.kcr button>.kj1{inset:auto;left:0;top:0;width:100%;height:auto;aspect-ratio:198/200}
.kj img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.kj1{transform-origin:39% 2%}.kj2{transform-origin:33% 22.5%}.kj3{transform-origin:39.5% 63.5%}
.kch>.kj1,.kcr button>.kj1{filter:drop-shadow(0 3px 3px #0004)}
.kch::before,.kcr button::before{content:"";position:absolute;left:calc(39% - 4px);top:-4px;width:8px;height:8px;border-radius:50%;background:#d9a520;box-shadow:0 1px 2px #0006;z-index:1}
.today-date{padding-right:96px}
.kcard h2{margin-bottom:2px}
.kcard .note{margin:0 0 6px}
.kcr{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding-top:6px;margin-top:4px}
.kcr::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:3px;background:linear-gradient(#f2c94c,#b8860b);box-shadow:0 2px 3px #0003}
.kcr button{position:relative;border:none;background:none;padding:0;aspect-ratio:.76;max-width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.kcd .big{display:block;width:min(240px,70%);height:auto;margin:0 auto}
.kcd .nm{font-size:22px;font-weight:900;text-align:center;margin:8px 0 4px}
.kcd p{font-size:17px;line-height:1.6;margin:0 0 8px}
.kcd .addr{font-size:15px;color:var(--sub);font-weight:700}
.kcd .cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
.kcd .cols button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:2px;aspect-ratio:1}
.kcd .cols button.on{border-color:var(--accent);border-width:3px}
.kcd .cols img{width:100%;height:100%;object-fit:contain;display:block}
.kcd .ig{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:14px;font-size:18px;font-weight:900;background:var(--accent);color:#fff;margin-top:6px}

/* ---------- storage: autosave on every change ---------- */
function load(k,d){try{const v=localStorage.getItem('med_'+k);return v?JSON.parse(v):d}catch(e){return d}}

/* carry over records from older versions */
try{if(!localStorage.getItem('med_checks')){const o=JSON.parse(localStorage.getItem('checks')||'null');if(o&&typeof o=='object')data=o}
 if(!localStorage.getItem('med_meds')){const o=JSON.parse(localStorage.getItem('meds')||'null');if(typeof o=='string'&&o)meds.memo=o}}catch(e){}
try{if(!load('mergedV1',false)){const o=JSON.parse(localStorage.getItem('medcheck-v1')||'null');
 if(o&&typeof o=='object'){const fresh=!localStorage.getItem('med_meds');
  Object.keys(o.checks||{}).forEach(k=>{const p=k.split('-').map(Number);if(p.length!=3)return;const nk=p[0]+'-'+p[1]+'-'+p[2],a=data[nk]||[false,false,false],b=o.checks[k]||[];data[nk]=[0,1,2].map(i=>!!(a[i]||b[i]))});
  (o.names||[]).forEach((n,i)=>{if(n&&!meds['m'+i])meds['m'+i]=n});
  if(fresh&&Array.isArray(o.use)&&o.use.some(Boolean))meds.use=[0,1,2].map(i=>!!o.use[i]);}
 store('checks',data);store('meds',meds);store('mergedV1',true)}}catch(e){}
if(!Array.isArray(meds.list)){meds.list=[];[0,1,2].forEach(i=>{const n=(meds['m'+i]||'').trim();if(!n)return;const f=meds.list.find(m=>m.n==n);if(f)f.t[i]=true;else{const t=[false,false,false];t[i]=true;meds.list.push({n,t})}})}
meds.list.forEach(m=>{if(!Array.isArray(m.t))m.t=[true,false,false];if(m.k==null)m.k=0;if(!m.s)m.s={on:false,days:30,start:''}});

const parseIso=s=>{const p=String(s||'').split('-').map(Number);if(p.length!=3||!p[0])return null;const d=new Date(p[0],p[1]-1,p[2]);d.setHours(0,0,0,0);return d};
const act=()=>{const a=[0,1,2].filter(i=>meds.list.some(m=>m.t[i]));if(a.length)return a;const u=[0,1,2].filter(i=>meds.use[i]);return u.length?u:[0,1,2]};

/* ---------- sound: short beep on every touch ---------- */
let AC=null;
function tone(f,dur,vol){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.01)}catch(e){}}
function beep(){tone(1200,.08,.2);try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}}
document.addEventListener('pointerdown',e=>{const t=e.target;if(t&&t.closest&&t.closest('button,a,label,input,select,.press,[role="button"]'))beep()},true);

/* ---------- remaining supply ---------- */
function supply(m){
 if(!m.s||!m.s.on)return null;const sl=[0,1,2].filter(i=>m.t[i]),n=sl.length,start=parseIso(m.s.start),days=+m.s.days;
 if(!n||!start||!(days>0))return null;
 const td=today0();let taken=0;const d=new Date(start);let guard=0;
 while(d<=td&&guard<2000){const s=st(dkey(d));sl.forEach(i=>{if(s[i])taken++});d.setDate(d.getDate()+1);guard++}
 const rem=days*n-taken;return {rem,left:Math.max(0,Math.ceil(rem/n))}}

}

const ixNorm=x=>String(x||'').normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).replace(/[\s・･\-‐]/g,'');
const IXN={};for(const g in IXG)IXN[g]=IXG[g].map(k=>{const p=k[0]=='='||k[0]=='^'?k[0]:'';return [p,ixNorm(p?k.slice(1):k)]});
function ixHit(name,g){const n=ixNorm(name);return IXN[g].some(([p,k])=>p=='='?n==k:p=='^'?n.startsWith(k):n.includes(k))}
function ixCalc(){const l=meds.list,out=[],seen=new Set();
 IXR.forEach(([a,b])=>{const A=l.filter(m=>ixHit(m.n,a)),B=l.filter(m=>ixHit(m.n,b));
  A.forEach(x=>{
   if(B.length)B.forEach(y=>{if(x===y)return;const k=[x.n,y.n].sort().join('|');if(seen.has(k))return;seen.add(k);out.push({k,a:x.n,b:y.n})});
   else if(IXF[b]){const f=IXF[b][L]||IXF[b].ja,k=x.n+'|F:'+b;if(seen.has(k))return;seen.add(k);out.push({k,a:x.n,b:f})}})});
 return out}
const ixKeys=()=>new Set(ixCalc().map(p=>p.k));

function showIx(ps){const t=IXT[L]||IXT.ja;openDlg(`<h3>${esc(t.h)}</h3>${ixHTML(ps,1)}<button type="button" class="close" id="dc">${T.close}</button>`);$('dc').onclick=closeDlg}

 say(done?S.all:pick(S.ok),'hop');tone(1047,.09,.2);setTimeout(()=>tone(1568,.12,.2),110);if(done)setTimeout(()=>tone(2093,.15,.18),240)}

/* ---------- keychains: always hang straight down and sway ---------- */
const swings=[];
/* gold cord is soft: upper cord, lower cord and the charm each turn at their own joint */
function hangOne(btn,c){const P=KCP[c];
 btn.innerHTML=`<div class="kj kj1"><img src="${P[0]}" alt=""><div class="kj kj2"><img src="${P[1]}" alt=""><div class="kj kj3"><img src="${P[2]}" alt=""></div></div></div>`;
 const j=btn.querySelectorAll('.kj'),a0=KR[0]+(Math.random()-.5)*16;
 swings.push({j,a:[a0,a0+KR[1],a0+KR[1]+KR[2]],v:[0,0,0],ph:Math.random()*6.28})}
/* rest angles worked out from the photo so the weight of the charm hangs right under the loop */
const KR=[-4.3,6.1,68.2];
function drawKeys(){const S=SCT[L]||SCT.ja,N=KCN[L]||KCN.ja;$('kcH').textContent=S.kH;$('kcN').textContent=S.kN;
 swings.length=0;
 [['kcr1',0],['kcr2',5]].forEach(([id,o])=>{$(id).innerHTML=[0,1,2,3,4].map(j=>`<button type="button" data-c="${o+j}" aria-label="${esc(N[o+j])}"></button>`).join('')});
 document.querySelectorAll('.kch,.kcr button').forEach(b=>{hangOne(b,+b.dataset.c);b.onclick=()=>{askTilt();openKey(+b.dataset.c);kick(b)}})}
function kick(b){const s=swings.find(x=>x.j[0].parentNode===b);if(s){const d=Math.random()<.5?-1:1;s.v[2]+=d*260;s.v[1]+=d*60}}
function openKey(c){const S=SCT[L]||SCT.ja,N=KCN[L]||KCN.ja;
 openDlg(`<div class="kcd"><img class="big" id="kBig" src="${KCI[c]}" alt="${esc(N[c])}"><div class="nm">${esc(S.kName)}</div><div style="text-align:center;font-weight:800;color:var(--sub)" id="kNm">${esc(N[c])}</div>
 <div class="cols">${KCI.map((s,i)=>`<button type="button" data-c="${i}" class="${i==c?'on':''}" aria-label="${esc(N[i])}"><img src="${s}" alt=""></button>`).join('')}</div>
 <p>${esc(S.kP)}</p><div class="addr">MIRATERIA　沖縄県島尻郡八重瀬町長毛379-3</div>
 <a class="ig btn" href="https://www.instagram.com/mirateria.project/" target="_blank" rel="noopener">${S.kIg}</a></div><button type="button" class="close" id="dc">${T.close}</button>`);
 $('dc').onclick=closeDlg;
 $('dlg').querySelectorAll('.cols button').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;$('kBig').src=KCI[i];$('kNm').textContent=N[i];$('dlg').querySelectorAll('.cols button').forEach(x=>x.classList.toggle('on',x===b))})}
/* tilt: the keychain turns against the phone's tilt so it keeps hanging straight down */
let tilt=0,tiltOn=false,lastY=scrollY;
function onTilt(e){if(e.gamma==null)return;tiltOn=true;let g=e.gamma;const o=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
 if(o==90)g=-(e.beta||0);else if(o==-90||o==270)g=(e.beta||0);tilt=Math.max(-70,Math.min(70,-g))}
try{addEventListener('deviceorientation',onTilt)}catch(e){}
let asked=false;
function askTilt(){if(asked||tiltOn)return;asked=true;try{const D=window.DeviceOrientationEvent;if(D&&typeof D.requestPermission=='function')D.requestPermission().then(r=>{if(r=='granted')addEventListener('deviceorientation',onTilt)}).catch(()=>{})}catch(e){}}
addEventListener('scroll',()=>{const d=Math.max(-40,Math.min(40,(scrollY-lastY)*1.2));lastY=scrollY;swings.forEach(s=>{s.v[0]+=d*.4;s.v[1]+=d*.8;s.v[2]+=d*1.4})},{passive:true});
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let lt=performance.now();
function swingLoop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;
 swings.forEach(s=>{const target=tilt+(tiltOn||still?0:Math.sin(t/1000*1.3+s.ph)*4),a=s.a,v=s.v;
  /* each piece is pulled toward the one above it; the heavy charm also tugs the cord */
  const d1=a[1]-a[0]-KR[1],d2=a[2]-a[1]-KR[2];
  const f0=-30*(a[0]-target-KR[0])-2.6*v[0]+9*d1,
        f1=-40*d1-2.4*v[1]+10*d2,
        f2=-22*d2-1.6*v[2];
  for(let n=0;n<4;n++){const h=dt/4;v[0]+=f0*h;v[1]+=f1*h;v[2]+=f2*h}
  for(let i=0;i<3;i++){v[i]=Math.max(-900,Math.min(900,v[i]));a[i]+=v[i]*dt}
  s.j[0].style.transform='rotate('+a[0].toFixed(2)+'deg)';
  s.j[1].style.transform='rotate('+(a[1]-a[0]).toFixed(2)+'deg)';
  s.j[2].style.transform='rotate('+(a[2]-a[1]).toFixed(2)+'deg)'});
 requestAnimationFrame(swingLoop)}
requestAnimationFrame(swingLoop);

/* ---------- ZIP for GitHub (shown only inside Claude) ---------- */
(async()=>{try{if(!window.claude||!window.claude.use)return;const dl=await window.claude.use('downloads');if(!dl)return;
 $('ghpanel').hidden=false;
 $('zipB').onclick=async()=>{const m=$('zipMsg');m.textContent='';try{const tx=(await (await fetch('med-github.txt')).text()).trim();
  const bin=atob(tx),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  await dl.save({filename:'med-github.zip',data:new Blob([u],{type:'application/zip'})});m.textContent='✓ 保存しました'}
  catch(e){m.textContent=e&&e.code==='declined'?'保存をやめました':'保存できませんでした。もう一度押してください'}}}catch(e){}})();
